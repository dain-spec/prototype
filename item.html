<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>품목 이동</title>
<style>
:root{--pri:#105aff;--t1:#333;--t2:#777;--line:#e1e1e1;--red:#fa4553}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#d9dce2;display:flex;justify-content:center;align-items:center;min-height:100vh;color:var(--t1);letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.phone{width:375px;height:812px;background:#fff;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08);border-radius:32px;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600}
.bar{height:48px;flex:none;display:flex;align-items:center;padding:0 16px}.back{width:24px;height:24px}.back svg{width:24px;height:24px;stroke-width:1.8}
.top{padding:20px 16px 0;flex:none}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px}.title h1{font-size:24px;font-weight:700;line-height:34px;letter-spacing:-.02em}
.badge{height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--red);color:var(--red);font-size:12px;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap}
.badge.ok{border-color:#27c36f;color:#27c36f}
.info{margin-top:16px;padding:12px 16px;border-radius:12px;background:#f0f4fa;display:grid;grid-template-columns:1fr 1fr;gap:12px 8px}
.info dt{font-size:14px;color:#50596c;line-height:20px}.info dd{font-size:15px;font-weight:500;line-height:21px;margin-top:2px}
.list{flex:1;margin-top:24px;background:#f0f2f7;padding:20px 16px;overflow-y:auto;min-height:0}.list::-webkit-scrollbar{display:none}
.cnt{font-size:16px;font-weight:700;margin-bottom:0;height:40px;display:flex;align-items:center}.cnt b{color:var(--pri);margin-left:4px}
.card{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 16px;margin-bottom:8px;min-height:60px}
.card .l{flex:1;min-width:0}.card .n{font-size:16px;font-weight:500;line-height:22px}
.card .s{font-size:14px;color:var(--t2);line-height:20px}.card .s i{font-style:normal;color:#ccc;margin:0 5px}
.card .arr{width:14px;height:14px;color:var(--t2);flex:none}
.card .soon{display:flex;align-items:center;gap:4px;font-size:14px;color:#989898;flex:none}.card .soon svg{width:14px;height:14px;fill:#989898;stroke:none}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:30}
.toast{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(26,29,35,.92);color:#fff;font-size:13px;padding:11px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:40;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:10}.dim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;transform:translateY(100%);transition:.3s;z-index:11;padding:8px 16px 24px}.sheet.show{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:#6b6b6b;margin:0 auto 14px}
.sheet h2{font-size:17px;font-weight:700;line-height:24px;margin-bottom:8px}
.srow{height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ededed;font-size:16px;font-weight:500}.srow.last{border-bottom:0}
.srow b{font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.ico{width:16px;height:16px;fill:var(--red);stroke:none;flex:none}
.warn{margin-top:12px;padding:16px;border-radius:12px;background:#fdf4f5;border:1px solid #f4e1e4}
.warn h3{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;color:var(--red);line-height:21px}.warn p{margin-top:6px;font-size:14px;line-height:20px}
.list{padding-top:20px!important}
</style></head><body>
<div class="phone">
<div class="status"><span>9:41</span><span>●●● 100%</span></div>
<div class="bar"><button class="back" id="back" aria-label="뒤로가기"><svg viewBox="0 0 24 24"><path d="M20 12H4M10 5l-7 7 7 7"/></svg></button></div>
<div class="top">
 <div class="title"><h1 id="name">스마트A10 프린터</h1><span class="badge">안전재고 미달</span></div>
 <dl class="info">
  <div><dt>품목코드</dt><dd>P10001</dd></div><div><dt>품목코드</dt><dd>SPA10-BK / EA</dd></div>
  <div><dt>현재고</dt><dd>120EA</dd></div><div><dt>가용재고</dt><dd>95EA</dd></div>
 </dl>
</div>
<div class="list">
 <button class="card" data-go="1"><div class="l"><div class="n">재고자산명세서</div><div class="s">현재고<i>|</i>가용재고<i>|</i>재고금액</div></div><svg class="arr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
 <button class="card"><div class="l"><div class="n">창고별 재고현황</div><div class="s">창고별 보유수량<i>|</i>재고금액</div></div><span class="soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16v1.5" stroke="#fff" stroke-width="2"/></svg>준비중</span></button>
 <button class="card"><div class="l"><div class="n">최근 입출고 이력</div><div class="s">시간순 입출고→ 각 건 원전표</div></div><span class="soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16v1.5" stroke="#fff" stroke-width="2"/></svg>준비중</span></button>
 <button class="card"><div class="l"><div class="n">품목별 매출 현황</div><div class="s">매출<i>|</i>비중<i>|</i>순위</div></div><span class="soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16v1.5" stroke="#fff" stroke-width="2"/></svg>준비중</span></button>
</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="재고자산명세서">
 <div class="grab"></div><h2>재고자산명세서</h2>
 <div class="srow"><span>상태</span><b><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6.5v7M12 16.5v1.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>90EA 부족</b></div>
 <div class="srow"><span>안전재고</span><b>120EA</b></div>
 <div class="srow last"><span>재고금액</span><b>37,500,000원</b></div>
 <div class="warn"><h3><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6.5v7M12 16.5v1.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>안전재고 미달</h3><p>발주 등록은 SmartA10 웹에서 진행합니다.</p></div>
</div>
<div class="home"></div><div class="toast"></div></div>
<script>
const $=s=>document.querySelector(s),P=new URLSearchParams(location.search);
function toast(m){const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
if(P.get('n'))$('#name').textContent=P.get('n');
$('#back').onclick=()=>{if(/\/result\.html/.test(document.referrer))return history.back();const q=new URLSearchParams(P);q.delete('n');location.href='result.html?'+q.toString()};
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const n=c.querySelector('.n').textContent;if(c.dataset.go)openSheet();else toast(`${n} 화면은 준비 중입니다.`)});
const openSheet=()=>{$('#dim').classList.add('show');$('#sheet').classList.add('show')},closeSheet=()=>{$('#dim').classList.remove('show');$('#sheet').classList.remove('show')};$('#dim').onclick=closeSheet;
try{if(parent!==window)parent.postMessage({specPage:5},'*')}catch(e){}
</script><script src="comments.js"></script><script src="fit.js"></script></body></html>
