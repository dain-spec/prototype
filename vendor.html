<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구매처 채무 상세</title>
<style>
:root{--pri:#105aff;--t1:#333;--t2:#777;--line:#e1e1e1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#d9dce2;display:flex;justify-content:center;align-items:center;min-height:100vh;color:var(--t1);letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.phone{width:375px;height:812px;background:#fff;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08);border-radius:32px;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600}
.bar{height:48px;flex:none;display:flex;align-items:center;padding:0 16px}.back{width:24px;height:24px}.back svg{width:24px;height:24px;stroke-width:1.8}
.scroll{flex:1;overflow-y:auto;min-height:0;background:#f0f2f7}.scroll::-webkit-scrollbar{display:none}
.top{background:#fff;padding:20px 16px 24px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.meta{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--t2);line-height:24px;white-space:nowrap}
.meta .bm{height:24px;padding:0 6px;border-radius:6px;background:#ededed;color:#333;font-size:16px;font-weight:700;display:inline-flex;align-items:center;margin-right:2px}
.meta i{font-style:normal;color:#ccc}
.head h1{font-size:24px;font-weight:700;line-height:34px;margin-top:2px}
.btn-info{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;flex:none;margin-top:2px}
.sum{margin-top:16px;padding:16px;border-radius:12px;background:#f0f4fa}
.sr{display:flex;justify-content:space-between;align-items:center;height:32px;font-size:14px;color:#50596c}.sr b{font-size:15px;font-weight:500;color:var(--t1)}
.hr{height:1px;background:#d9deea;margin:8px 0}
.big{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0}
.big .l{font-size:15px;font-weight:500;line-height:21px}.big .l small{display:block;font-size:13px;color:var(--t2);margin-top:4px;font-weight:400;line-height:18px}
.big .r{text-align:right;font-size:16px;font-weight:700;line-height:22px}.big .r small{display:block;font-size:14px;color:var(--t2);margin-top:4px;line-height:20px}
.bal{display:flex;justify-content:space-between;align-items:center;padding:6px 0 0}.bal span{font-size:15px;font-weight:500}.bal b{font-size:16px;font-weight:700;color:var(--pri)}
.sr b.red{color:#fa4553}
.list{padding:20px 16px 20px}
.lh{height:40px;display:flex;align-items:center;justify-content:space-between}.lh h2{font-size:16px;font-weight:700}
.sort{display:flex;align-items:center;gap:2px;font-size:14px;color:#555}.sort svg{width:18px;height:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:8px;cursor:pointer}
.card.simple{display:flex;justify-content:space-between;align-items:center;min-height:48px}.card.simple span{font-size:16px}.card.simple b{font-size:15px;font-weight:700}
.crow{display:flex;justify-content:space-between;align-items:flex-start}
.crow .d{display:flex;align-items:center;gap:8px;font-size:16px;line-height:22px}
.bd{height:20px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.bd.in{background:#e7efff;color:var(--pri)}.bd.out{background:#ffecee;color:#fa4553}
.crow .a{text-align:right;font-size:15px;font-weight:700;line-height:21px}.crow .a small{display:block;font-size:13px;font-weight:400;color:var(--t2);margin-top:4px;line-height:18px}
.sub{margin-top:10px;padding-top:10px;border-top:1px solid #ededed;font-size:13px;color:var(--t2);line-height:18px}.sub i{font-style:normal;color:#ccc;margin:0 4px}
.cta{display:block;width:100%;height:44px;margin-top:16px;border-radius:8px;background:var(--pri);color:#fff;font-size:15px;font-weight:700}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:30}
.toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);background:rgba(26,29,35,.92);color:#fff;font-size:13px;padding:11px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:40;white-space:nowrap}.toast.show{opacity:1}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:10}.dim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;transform:translateY(100%);transition:.3s;z-index:11;padding:8px 16px 34px}.sheet.show{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:#6b6b6b;margin:0 auto 14px}
.sheet h2{font-size:17px;font-weight:700;line-height:24px;margin-bottom:6px}
.irow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #ededed}.irow:last-child{border-bottom:0}
.irow dt{font-size:14px;color:var(--t2);line-height:20px}.irow dd{font-size:16px;line-height:22px;margin-top:2px}
.ibtn{display:flex;gap:16px;flex:none}.ibtn button{width:24px;height:24px;color:#333}.ibtn svg{width:24px;height:24px}
</style></head><body>
<div class="phone">
<div class="status"><span>9:41</span><span>●●● 100%</span></div>
<div class="bar"><button class="back" id="back" aria-label="뒤로가기"><svg viewBox="0 0 24 24"><path d="M20 12H4M10 5l-7 7 7 7"/></svg></button></div>
<div class="scroll">
 <div class="top">
  <div class="head"><div><div class="meta"><span class="bm" id="bm"></span>V1001<i>|</i><span id="kind"></span><i>|</i>김더존</div><h1 id="vname"></h1></div><button class="btn-info" id="info">거래처정보</button></div>
  <div class="sum" id="sum"></div>
 </div>
 <div class="list">
  <div class="lh"><h2>거래내역</h2><button class="sort" id="sort"><span id="sortT">오래된순</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
  <div class="card simple"><span>전기(월)이월</span><b id="open"></b></div>
  <div id="tx"></div>
  <button class="cta" id="cta"></button>
 </div>
</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="거래처 정보">
 <div class="grab"></div><h2>거래처 정보</h2>
 <dl>
  <div class="irow"><div><dt>상호명</dt><dd>(주)스마트상사</dd></div></div>
  <div class="irow"><div><dt>사업자등록번호</dt><dd>123-09-09876</dd></div></div>
  <div class="irow"><div><dt>결제조건</dt><dd>익월 10일</dd></div></div>
  <div class="irow"><div><dt>사업장 주소</dt><dd>서울시 금천구 가산디지털 1로 168 스카이빌딩 24층 1023호</dd></div></div>
  <div class="irow"><div><dt>대표번호</dt><dd>02-987-6540</dd></div><div class="ibtn"><button data-t="전화" aria-label="전화"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button></div></div>
  <div class="irow"><div><dt>담당자</dt><dd>010-0988-0987</dd></div><div class="ibtn"><button data-t="전화" aria-label="전화"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button><button data-t="문자" aria-label="문자"><svg viewBox="0 0 24 24"><path d="M12 4C7.6 4 4 7.1 4 11c0 2.1 1 4 2.7 5.3L6 20l3.7-1.7c.7.2 1.5.3 2.3.3 4.4 0 8-3.1 8-7s-3.6-7-8-7z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke-width="2.4"/></svg></button></div></div>
 </dl>
</div>
<div class="home"></div><div class="toast"></div></div>
<script>
const $=s=>document.querySelector(s),P=new URLSearchParams(location.search);
function toast(m){const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
const CFG={
 p:{badge:'채무',kind:'구매처',cta:'미지급 현황',name:'(주)스마트상사',open:'120,900,000원',
  rows:[['전기(월)이월','120,900,000원'],['당기입고','49,500,000원'],['당기지급','42,000,000원']],big:['미지급 잔액','128,400,000원','선급금잔액(차감)','0원'],bal:['채무잔액','128,400,000원'],extra:[],
  tx:[{d:'2026-08-28',k:'입고',c:'in',a:'29,700,000원',b:'채무잔액 150,600,000원',s:'PTX2026082800004<i>|</i>스마트A10 프린터'},{d:'2026-08-31',k:'지급',c:'out',a:'42,000,000원',b:'채무잔액 108,600,000원',s:'등록된 품목 없음'}]},
 r:{badge:'채권',kind:'거래처',cta:'미수 현황',name:'(주)ABC 스마트 상사',open:'12,000,000원',
  rows:[['전기(월)이월','12,000,000원'],['당기발생','3,300,000원'],['당기수금','0원']],big:['미수잔액','15,300,000원','선수금잔액(차감)','0원'],bal:['채권잔액','15,300,000원'],extra:[['채권한도액','15,000,000원',''],['한도초과액','300,000원','red']],
  tx:[{d:'2026-08-28',k:'출고',c:'in',a:'3,300,000원',b:'채권잔액 150,600,000원',s:'PTX2026082800004<i>|</i>토너 카트리지'}]}};
const C=CFG[P.get('t')==='r'?'r':'p'],TX=C.tx;
$('#bm').textContent=C.badge;$('#kind').textContent=C.kind;$('#vname').textContent=C.name;$('#open').textContent=C.open;$('#cta').textContent=C.cta;document.title=C.badge==='채권'?'거래처 채권 상세':'구매처 채무 상세';
$('#sum').innerHTML=C.rows.map(r=>`<div class="sr"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')+`<div class="hr"></div><div class="big"><div class="l">${C.big[0]}<small>${C.big[2]}</small></div><div class="r">${C.big[1]}<small>${C.big[3]}</small></div></div><div class="hr"></div><div class="bal"><span>${C.bal[0]}</span><b>${C.bal[1]}</b></div>`+C.extra.map(r=>`<div class="sr"><span>${r[0]}</span><b class="${r[2]}">${r[1]}</b></div>`).join('');
let asc=true;
function draw(){const l=asc?TX:[...TX].reverse();$('#sortT').textContent=asc?'오래된순':'최신순';
 $('#tx').innerHTML=l.map(t=>`<div class="card" data-n="${t.d}"><div class="crow"><div class="d">${t.d}<span class="bd ${t.c}">${t.k}</span></div><div class="a">${t.a}<small>${t.b}</small></div></div><div class="sub">${t.s}</div></div>`).join('');
 $('#tx').querySelectorAll('.card').forEach(c=>c.onclick=()=>toast(`${c.dataset.n} 원전표 화면은 다음 단계입니다.`))}
$('#sort').onclick=()=>{asc=!asc;draw()};
const openSheet=()=>{$('#dim').classList.add('show');$('#sheet').classList.add('show')},closeSheet=()=>{$('#dim').classList.remove('show');$('#sheet').classList.remove('show')};
$('#info').onclick=()=>{if(C===CFG.p)openSheet();else toast('거래처정보 (다음 단계)')};$('#dim').onclick=closeSheet;
document.querySelectorAll('.ibtn button').forEach(b=>b.onclick=()=>toast(b.dataset.t+' 연결 (다음 단계)'));
$('#cta').onclick=()=>toast(C.cta+' (다음 단계)');
$('#back').onclick=()=>{if(/\/result\.html/.test(document.referrer))return history.back();const q=new URLSearchParams(P);q.delete('t');location.href='result.html?'+q.toString()};
draw();
try{if(parent!==window)parent.postMessage({specPage:6},'*')}catch(e){}
</script><script src="comments.js"></script><script src="fit.js"></script></body></html>
