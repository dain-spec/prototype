<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체메뉴</title>
<style>
:root{--t1:#333;--line:#ededed;--bg:#f5f6fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#d9dce2;display:flex;justify-content:center;align-items:center;min-height:100vh;color:var(--t1);letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.phone{width:375px;height:812px;background:#fff;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08);border-radius:32px;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600}
.bar{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px}.bar .x{width:24px;height:24px}.bar .x svg{width:24px;height:24px;stroke-width:1.8}.bar h2{font-size:18px;font-weight:700;flex:1}.bar .q{width:24px;height:24px}.bar .q svg{width:24px;height:24px}
.scroll{flex:1;overflow-y:auto;min-height:0;background:var(--bg);padding-bottom:40px}.scroll::-webkit-scrollbar{display:none}
.sec{background:#fff;margin-bottom:8px}.sec:first-child{margin-top:0}
.sec h3{height:44px;display:flex;align-items:flex-end;padding:0 16px 8px;font-size:16px;font-weight:700}
.item{width:100%;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:16px;text-align:left;margin:0 0;}
.item:last-child{border-bottom:0}.item svg{width:16px;height:16px;color:#aaa;flex:none}
.item span{margin-right:auto}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:30}
.toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);background:rgba(26,29,35,.92);color:#fff;font-size:13px;padding:11px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:40;white-space:nowrap}.toast.show{opacity:1}
</style></head><body>
<div class="phone">
<div class="status"><span>9:41</span><span>●●● 100%</span></div>
<div class="bar"><button class="x" id="close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button><h2>전체메뉴</h2><button class="q" data-t="도움말" aria-label="도움말"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7M12 16.6v.4"/></svg></button></div>
<div class="scroll" id="sc"></div>
<div class="home"></div><div class="toast"></div></div>
<script>
const $=s=>document.querySelector(s);
function toast(m){const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
const M=[['영업',['판매일(월)보','출고 현황','출고 예정/납기현황','거래처 현황','세금계산서 처리상태','매출마감 현황']],['구매',['구매일(월)보','입고 현황','입고 예정/발주 지연','구매처 현황']],['재고',['재고자산명세서','창고별 재고현황','재고 부족 현황','장기재고 현황']],['채권.채무',['미수금 현황','미지급 현황','수금/지급 현황','오늘 수금 예정','오늘 지급 예정']],['실적',['매출이익현황','담당자별 매출현황','품목별 매출현황','거래처별 매출현황']]];
const AR='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
$('#sc').innerHTML=M.map(([t,l])=>`<section class="sec"><h3>${t}</h3>${l.map(n=>`<button class="item" data-n="${n}"><span>${n}</span>${AR}</button>`).join('')}</section>`).join('');
document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='출고 예정/납기현황'&&parent!==window)parent.postMessage({gotoMenu:'deliv'},'*');else toast(n+' (다음 단계)')});
document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>toast(e.dataset.t+' (다음 단계)'));
$('#close').onclick=()=>{if(/\/dashboard\.html/.test(document.referrer))history.back();else location.href='dashboard.html'+location.search};
</script><script src="comments.js"></script><script src="fit.js"></script></body></html>
