<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통합검색 프로토타입</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#d9dce2;display:flex}
.specpane{width:360px;flex:none;height:100%;background:#e3ebff;border-right:1px solid #c9d6f5;overflow-y:auto;padding:24px 20px}
.specpane h2{font-size:15px;font-weight:700;color:#233a73;margin-bottom:12px}
.specpane img{display:block;width:100%;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(35,58,115,.12)}
.stage{flex:1;position:relative;min-width:0;height:calc(100% - 40px)}
.note{position:fixed;left:360px;right:0;bottom:0;height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#5c6370;letter-spacing:-.02em;padding:0 16px;text-align:center}
#fit{position:absolute;left:50%;top:24px;display:flex;align-items:flex-start;gap:24px;transform-origin:top center}
.col{width:400px}.col h2{height:44px;font-size:15px;font-weight:700;color:#333;text-align:center;line-height:20px}
.col h2 span{display:block;font-size:12px;font-weight:500;color:#5c6370;margin-top:2px}
iframe{display:block;border:0;width:400px;height:850px;background:transparent}
.reset{position:fixed;right:16px;top:12px;font-size:12px;color:#5c6370;background:#fff;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;z-index:2}
</style></head><body>
<button class="reset" id="reset">처음부터 다시</button>
<aside class="specpane"><h2>설계서</h2><div class="specwrap"><img src="spec.png" alt="통합검색 설계서"></div></aside>
<main class="stage"><div id="fit">
 <div class="col"><iframe src="A.html?nospec" title="A안"></iframe></div>
 <div class="col"><iframe src="B.html?nospec" title="B안"></iframe></div>
</div></main>
<footer class="note">*본 프로토타입은 참고용으로 제작된 것으로 최종 디자인 산출물이 아니며, 최종 산출물은 피그마 파일을 확인해 주세요.</footer>
<script>
const fit=document.getElementById('fit'),stage=document.querySelector('.stage');
function go(){const w=fit.offsetWidth,h=fit.offsetHeight,s=Math.min(1,(stage.clientWidth-24)/w,(stage.clientHeight-48)/h);fit.style.transform=`translate(-50%,0) scale(${s})`}
addEventListener('resize',go);go();
document.getElementById('reset').onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.contentWindow.location.reload());
</script><script src="comments.js"></script></body></html>
