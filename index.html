<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통합검색 프로토타입</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#d9dce2;display:flex;flex-direction:column}
.hdr{height:56px;flex:none;background:#fff;border-bottom:1px solid #e1e4ea;display:flex;align-items:center;gap:28px;padding:0 20px;z-index:5}
.logo{font-size:15px;font-weight:800;color:#233a73;letter-spacing:-.02em;white-space:nowrap}
.hnav{display:flex;gap:4px;height:100%}.hnav button{position:relative;font:600 14px Pretendard,sans-serif;color:#5c6370;padding:0 16px;border:0;background:none;cursor:pointer;height:100%}
.hnav button.on{color:#105aff}.hnav button.on:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#105aff}
.hdr .sp{flex:1}
.wrap{flex:1;display:flex;min-height:0}
.specpane{width:480px;flex:none;height:100%;background:#e3ebff;border-right:1px solid #c9d6f5;overflow-y:auto;padding:24px 20px}
.specpane h2{font-size:15px;font-weight:700;color:#233a73;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.zoom{display:block;margin:16px auto 0;font:600 13px Pretendard,sans-serif;color:#233a73;background:#fff;border:1px solid #c9d6f5;border-radius:8px;padding:9px 20px;cursor:pointer}
.pg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pg button{font:600 12px Pretendard,sans-serif;color:#4a5f93;background:#f3f6ff;border:1px solid #c9d6f5;border-radius:14px;padding:5px 10px;cursor:pointer}
.pg button.on{background:#233a73;border-color:#233a73;color:#fff}
.pg button.match{box-shadow:0 0 0 2px #7a4dff}
.match-note{font-size:12px;color:#5b3fd1;margin-bottom:10px;min-height:16px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;overflow:auto;display:none;padding:24px}.lb.show{display:block}.lb img{display:block;width:min(960px,100%);margin:0 auto;background:#fff;border-radius:8px}
.specpane img{display:block;width:100%;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(35,58,115,.12)}
.stage{flex:1;position:relative;min-width:0;height:calc(100% - 40px)}
.note{position:fixed;left:480px;right:0;bottom:0;height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#5c6370;letter-spacing:-.02em;padding:0 16px;text-align:center}
#fit{position:absolute;left:50%;top:24px;display:flex;align-items:flex-start;gap:24px;transform-origin:top center}
.col{width:400px}.swap{display:block;margin:12px auto 0;font:600 13px Pretendard,sans-serif;color:#105aff;background:#fff;border:1px solid #c9d6f5;border-radius:16px;padding:8px 16px;cursor:pointer;text-decoration:underline}.col[hidden]{display:none}.col h2{height:44px;font-size:15px;font-weight:700;color:#333;text-align:center;line-height:20px}
.col h2 span{display:block;font-size:12px;font-weight:500;color:#5c6370;margin-top:2px}
iframe{display:block;border:0;width:400px;height:850px;background:transparent}
.reset{font-size:12px;color:#5c6370;background:#f3f4f7;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
</style></head><body>
<header class="hdr"><span class="logo">SmartA10 물류관리 모바일</span><nav class="hnav" id="menu"><button data-m="dash">대시보드</button><button data-m="search" class="on">통합검색</button><button data-m="deliv">출고예정납기현황</button></nav><span class="sp"></span><button class="reset" id="reset">처음부터 다시</button></header>
<div class="wrap">
<aside class="specpane"><h2><span>설계서 <small id="stitle" style="font-weight:500;color:#5b6f9f">SmartA10 모바일 통합검색 디자인요청</small></span></h2>
<div class="pg" id="pg"></div><div class="match-note" id="mn"></div>
<div class="specwrap" id="sw" data-ckey="spec-p1"><img id="simg" src="spec/p1.jpg" alt="설계서"></div>
<button class="zoom" id="zoom">크게 보기</button></aside>
<div class="lb" id="lb"><img id="limg" alt=""></div>
<main class="stage"><div id="fit">
 <div class="col"><iframe id="proto" src="A.html?nospec" title="프로토타입"></iframe><button class="swap" id="swap" type="button">검색필드에서 조회조건 설정</button></div>
 </div></main>
</div>
<footer class="note">*본 프로토타입은 참고용으로 제작된 것으로 최종 디자인 산출물이 아니며, 최종 산출물은 피그마 파일을 확인해 주세요.</footer>
<script>
const fit=document.getElementById('fit'),stage=document.querySelector('.stage');
function go(){const w=fit.offsetWidth,h=fit.offsetHeight,s=Math.min(1,(stage.clientWidth-24)/w,(stage.clientHeight-48)/h);fit.style.transform=`translate(-50%,0) scale(${s})`}
addEventListener('resize',go);go();
document.getElementById('reset').onclick=()=>proto.contentWindow.location.reload();

const proto=document.getElementById('proto'),swap=document.getElementById('swap');let isB=false;
let mode='search';
const MENU={dash:'placeholder.html?t='+encodeURIComponent('대시보드')+'&nospec',deliv:'placeholder.html?t='+encodeURIComponent('출고예정납기현황')+'&nospec'};
const NAME={dash:'대시보드',deliv:'출고예정납기현황'};
document.querySelectorAll('#menu button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#menu button').forEach(x=>x.classList.toggle('on',x===b));
 swap.style.display=mode==='search'?'':'none';proto.src=mode==='search'?(isB?'B.html':'A.html')+'?nospec':MENU[mode];go();setSpec()});
swap.onclick=()=>{isB=!isB;proto.src=(isB?'B.html':'A.html')+'?nospec';swap.textContent=isB?'필터 아이콘에서 조회조건 설정':'검색필드에서 조회조건 설정';go()};
</script><script>
const SPECS={
 search:{dir:'spec',title:'SmartA10 모바일 통합검색 디자인요청',pages:['첫 화면','검색 결과','탭·유형 전체','예외 상태','품목 이동','거래처·구매처 상세','원전표','상태별 노출','표시 자릿수']},
 dash:{dir:'spec-dash',title:'SmartA10 모바일 메인 대시보드 디자인요청',pages:['메인 대시보드','조회 범위 변경 패널','선택기간 업무 흐름 그래프','일별 목록 보기','상태별 노출 차이','표시 자릿수 기준']},
 deliv:{dir:'spec-deliv',title:'SmartA10 모바일 출고 예정/납기 현황 디자인요청',pages:['개요·목록','보기 방식·상태 필터','조회 범위·직접 입력·조건 검색','출고 예정 상세','거래처 정보·문자 보내기','수주 상세(원전표)','상태별 노출 차이','표시 자릿수 기준']}};
const cur={search:1,dash:1,deliv:1};let matched=1;
const pg=document.getElementById('pg'),simg=document.getElementById('simg'),sw=document.getElementById('sw');
function setSpec(){const S=SPECS[mode];document.getElementById('stitle').textContent=S.title;simg.hidden=false;showPage(cur[mode],false)}
function showPage(n,fromMatch){const S=SPECS[mode];cur[mode]=n;if(fromMatch&&mode==='search')matched=n;
 pg.innerHTML=S.pages.map((t,i)=>`<button class="${i+1===n?'on':''} ${mode==='search'&&i+1===matched?'match':''}" data-n="${i+1}">${i+1}. ${t}</button>`).join('');
 pg.querySelectorAll('button').forEach(b=>b.onclick=()=>showPage(+b.dataset.n,false));
 simg.src=`${S.dir}/p${n}.jpg`;sw.dataset.ckey=(mode==='search'?'spec-p':'spec-'+mode+'-p')+n;document.querySelector('.specpane').scrollTop=0;
 document.getElementById('mn').textContent=mode==='search'&&n===matched?'프로토타입 화면과 연결된 페이지':'';
 if(window.ucRefresh)window.ucRefresh()}
addEventListener('message',e=>{const d=e.data;if(d&&d.specPage&&mode==='search')showPage(d.specPage,true)});
document.getElementById('zoom').onclick=()=>{document.getElementById('limg').src=simg.src;document.getElementById('lb').classList.add('show')};
document.getElementById('lb').onclick=()=>document.getElementById('lb').classList.remove('show');
showPage(1,true);
</script><script src="comments.js"></script></body></html>
