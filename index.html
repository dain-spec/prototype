<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통합검색 프로토타입</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#d9dce2;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:12px 0 0}
.tabs{display:flex;gap:4px;padding:4px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tabs button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:#5c6370;padding:10px 18px;border-radius:10px;cursor:pointer}
.tabs button.on{background:#2f6bff;color:#fff}
.desc{font-size:13px;color:#5c6370;margin:10px 0 0;min-height:18px}
iframe{border:0;width:100%;flex:1;min-height:0;background:transparent}
.reset{margin-top:6px;font-size:12px;color:#5c6370;background:none;border:0;cursor:pointer;text-decoration:underline;font-family:inherit}
</style></head><body>
<div class="tabs"><button data-f="A.html" class="on">A안</button><button data-f="B.html">B안</button></div>
<div class="desc" id="desc"></div>
<button class="reset" id="reset">처음부터 다시</button>
<iframe id="fr" src="A.html"></iframe>
<script>
const D={'A.html':'필터 아이콘 → 기간설정 바텀시트에서 설정 후 검색','B.html':'검색필드 탭 → 조회기간 설정 + 검색어 입력'};
const fr=document.getElementById('fr'),desc=document.getElementById('desc');
function show(f){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));fr.src=f;desc.textContent=D[f];try{history.replaceState(null,'','#'+f[0])}catch(e){}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.f));
document.getElementById('reset').onclick=()=>fr.contentWindow.location.reload();
show(location.hash==='#B'?'B.html':'A.html');
</script></body></html>
